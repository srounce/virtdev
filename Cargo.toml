[package]
name = "virtdev"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
description = "Persistent HID device proxy over uhid"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
udev = "0.9"

[profile.release]
lto = true
codegen-units = 1
